<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina non trovata | CG Innovation Srl</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --cream: #F6F3EA;
      --forest: #2E5B4E;
      --forest-deep: #1E3A32;
      --ink: #22302B;
      --sage: #7E9B91;
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--sans);
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.65;
    }
    .card { max-width: 34rem; text-align: center; }
    .wordmark {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.45rem;
      color: var(--forest-deep);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
    }
    .wordmark .dot { color: var(--sage); }
    h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      color: var(--forest-deep);
      margin-bottom: 0.8rem;
    }
    p { margin-bottom: 1.8rem; }
    a.btn {
      display: inline-block;
      text-decoration: none;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      background: var(--forest);
      color: #fff;
      border: 1.5px solid var(--forest);
    }
    a.btn:hover { background: var(--forest-deep); border-color: var(--forest-deep); }
    a:focus-visible { outline: 3px solid var(--forest); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <a class="wordmark" href="/">FastFit<span class="dot">.</span></a>
    <h1>Pagina non trovata</h1>
    <p>La pagina che stai cercando non esiste o è stata spostata. Torna alla homepage per continuare la navigazione.</p>
    <a class="btn" href="/">Torna alla homepage</a>
  </main>
</body>
</html>
